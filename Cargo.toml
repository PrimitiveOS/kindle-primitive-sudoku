[workspace]
resolver = "2"
members = ["crates/sudoku-core", "crates/sudoku-render", "crates/sudoku-kindle", "crates/sudoku-desktop"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
sudoku-core = { path = "crates/sudoku-core" }
sudoku-render = { path = "crates/sudoku-render" }
primitive-app = { path = "../doannt-kindle-tools/crates/primitive-app" }
primitive-ui = { path = "../doannt-kindle-tools/crates/primitive-ui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
